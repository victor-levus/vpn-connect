name: Deploy backend (VPS)

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'deploy/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Type-check and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      DATABASE_URL: file:./data/ci.db
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Check shell scripts parse
        run: for f in ../deploy/*.sh; do bash -n "$f"; done

  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      # The key is restricted on the VPS (authorized_keys `command=`), so this connection can
      # only ever run deploy/update.sh — whatever command is sent here is ignored.
      - name: Run update.sh on the VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "root@$VPS_HOST" update

      - name: Check the public API
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsS https://vpn-api.sleecetechnologies.com.ng/api/health; then echo; exit 0; fi
            sleep 5
          done
          exit 1

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
