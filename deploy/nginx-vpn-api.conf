# /etc/nginx/sites-available/vpn-connect
# Reverse proxy for the VPN Connect API. Replace vpn-api.example.com with your API subdomain.
# HTTPS is added afterwards by:  certbot --nginx -d <your-domain> --redirect
server {
    listen 80;
    listen [::]:80;
    server_name vpn-api.example.com;

    location / {
        proxy_pass http://127.0.0.1:4807;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Live updates use Server-Sent Events: don't buffer, and keep idle streams open.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
